<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Routine</title>
<meta name="robots" content="noindex">

<!-- Installable, full-screen app on iPhone -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#cfbcef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routine">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,500&family=Poppins:wght@400;500&display=swap">
<style>
/* Layout: pastel night sky on top, rounded checklist card below */
:root {
  --sky-top: #cfbcef;
  --sky-mid: #dcbfe8;
  --sky-bottom: #f7c6dc;
  --card: #fbf0f8;
  --plum: #5c2559;
  --orchid: #b04ea6;
  --lilac: #c99ee0;
  --muted: #a46ba3;
  --star: #fbe39a;
  --cloud: #fbf7fd;
  --display: "Lora", Georgia, "Times New Roman", serif;
  --body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html {
  min-height: 100%;
  background: var(--sky-mid);
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--plum);
  font: 14px var(--body);
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
/* Sky gradient pinned to the screen (background-attachment: fixed is unreliable on iOS) */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-bottom) 100%);
}
.wrap { max-width: 460px; margin: 0 auto; }

/* Sky */
.sky { position: relative; height: 300px; }
.star { position: absolute; color: var(--star); line-height: 1; }
.star svg { display: block; width: 100%; height: 100%; fill: currentColor; }
.cloud {
  position: absolute; background: var(--cloud); border-radius: 999px;
  box-shadow: 0 6px 14px rgba(140, 90, 170, .12);
}
.cloud::before, .cloud::after { content: ""; position: absolute; background: var(--cloud); border-radius: 50%; }
.cloud.big { width: 104px; height: 46px; }
.cloud.big::before { width: 54px; height: 54px; left: 16px; top: -28px; }
.cloud.big::after { width: 40px; height: 40px; left: 52px; top: -18px; }
.cloud.small { width: 70px; height: 32px; }
.cloud.small::before { width: 36px; height: 36px; left: 12px; top: -18px; }
.cloud.small::after { width: 26px; height: 26px; left: 36px; top: -10px; }
.moon { position: absolute; right: 18px; top: 34px; width: 110px; height: 110px; }
.moon::before {
  content: ""; position: absolute; inset: -30px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,250,240,.55), rgba(255,250,240,0) 65%);
}
.moon svg { position: relative; width: 100%; height: 100%; }
@media (prefers-reduced-motion: no-preference) {
  .star { animation: twinkle 3.2s ease-in-out infinite; }
  .star:nth-child(2n) { animation-delay: 1.1s; }
  .star:nth-child(3n) { animation-delay: 2s; }
  @keyframes twinkle { 50% { opacity: .45; transform: scale(.85); } }
}

/* Card */
.card {
  position: relative;
  background: var(--card);
  border-radius: 32px;
  padding: 28px 24px 30px;
  box-shadow: 0 18px 40px rgba(150, 80, 150, .18);
}
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h2 {
  font-family: var(--display); font-style: italic; font-weight: 500;
  font-size: clamp(30px, 8vw, 38px); margin: 0; letter-spacing: -.01em; text-wrap: balance;
}
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
ul { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 4px; }
.item {
  display: flex; align-items: center; gap: 14px; width: calc(100% + 12px);
  background: none; border: 0; padding: 10px 6px; margin: 0 -6px; border-radius: 12px;
  min-height: 44px;
  font: inherit; font-size: 17px; color: var(--plum); text-align: left; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: background .15s;
}
@media (hover: hover) { .item:hover { background: rgba(201, 158, 224, .14); } }
.item:active { background: rgba(201, 158, 224, .2); }
.item:focus-visible { outline: 2px solid var(--orchid); outline-offset: 2px; }
.box {
  flex: none; width: 24px; height: 24px; border: 2px solid var(--orchid); border-radius: 7px;
  display: grid; place-items: center; transition: background .18s, transform .18s;
}
.box svg { width: 14px; height: 14px; stroke: var(--card); stroke-width: 3; fill: none; opacity: 0; transition: opacity .15s; }
.label { min-width: 0; transition: color .2s; }
.tag { font-size: 13px; color: var(--muted); margin-left: 6px; }
.item[aria-pressed="true"] .box { background: var(--orchid); transform: scale(1.05); }
.item[aria-pressed="true"] .box svg { opacity: 1; }
.item[aria-pressed="true"] .label { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--lilac); text-decoration-thickness: 2px; }

.wave { display: block; width: 100%; height: 18px; margin: 22px 0 18px; }
.wave path { stroke: var(--lilac); stroke-width: 2; fill: none; }

.foot {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-top: 22px; font-size: 13px; color: var(--muted);
}
.reset {
  font: inherit; font-size: 13px; color: var(--orchid); background: none;
  border: 1.5px solid var(--lilac); border-radius: 999px; padding: 8px 16px; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) { .reset:hover { background: rgba(201, 158, 224, .16); } }
.reset:active { background: rgba(201, 158, 224, .24); }
.reset:focus-visible { outline: 2px solid var(--orchid); outline-offset: 2px; }
.done-msg { font-family: var(--display); font-style: italic; font-size: 16px; color: var(--orchid); }
</style>
</head>
<body>

<div class="wrap">
  <div class="sky" aria-hidden="true">
    <span class="star" style="left:34%;top:30px;width:20px;height:20px"></span>
    <span class="star" style="left:10%;top:62px;width:30px;height:30px"></span>
    <span class="star" style="left:53%;top:62px;width:16px;height:16px"></span>
    <span class="star" style="left:26%;top:132px;width:18px;height:18px"></span>
    <span class="star" style="left:7%;top:150px;width:14px;height:14px"></span>
    <span class="star" style="left:60%;top:172px;width:24px;height:24px"></span>
    <span class="star" style="left:91%;top:180px;width:15px;height:15px"></span>
    <span class="star" style="left:43%;top:258px;width:20px;height:20px"></span>
    <span class="star" style="left:74%;top:276px;width:13px;height:13px"></span>
    <div class="moon">
      <svg viewBox="0 0 110 110">
        <path d="M70 6 A50 50 0 1 0 104 76 A40 40 0 0 1 70 6 Z" fill="#fde39a"/>
        <path d="M33 62 q6 5 12 0" stroke="#7a3b55" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <ellipse cx="41" cy="73" rx="6" ry="3.6" fill="#f4a3a8"/>
      </svg>
    </div>
    <div class="cloud big" style="right:70px;top:120px"></div>
    <div class="cloud big" style="left:4%;top:210px;transform:scale(1.15)"></div>
    <div class="cloud small" style="right:6%;top:236px"></div>
  </div>

  <main class="card">
    <section>
      <div class="head"><h2>Good morning</h2><span class="count" id="count-am"></span></div>
      <ul id="list-am"></ul>
    </section>

    <svg class="wave" viewBox="0 0 400 18" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 10 C40 2 60 2 100 9 S160 16 200 9 S260 2 300 9 S360 16 400 6"/>
    </svg>

    <section>
      <div class="head"><h2>Good night</h2><span class="count" id="count-pm"></span></div>
      <ul id="list-pm"></ul>
    </section>

    <div class="foot">
      <span id="status">Ticks clear by themselves each new day.</span>
      <button class="reset" id="reset" type="button">Clear today</button>
    </div>
  </main>
</div>

<script>
(function () {
  var STAR = '<svg viewBox="0 0 24 24"><path d="M12 1.8l2.9 6.4 7 .8-5.2 4.7 1.5 6.9L12 17.1l-6.2 3.5 1.5-6.9L2.1 9l7-.8z" stroke-linejoin="round"/></svg>';
  document.querySelectorAll('.star').forEach(function (s) { s.innerHTML = STAR; });

  /* ── Edit the checklist here. Keep each id unique. ── */
  var ROUTINE = {
    am: [
      { id: 'water', text: 'Glass of water' },
      { id: 'mocktail', text: 'Cherry-lime mocktail 🍒' },
      { id: 'stretch', text: 'Stretch + posture', tag: '5–10 min' },
      { id: 'face', text: 'Wash face' },
      { id: 'oatmeal', text: 'Oatmeal breakfast' },
      { id: 'schedule', text: 'Check schedule + top 3' },
      { id: 'class', text: 'Class or first task' }
    ],
    pm: [
      { id: 'top3', text: 'Write tomorrow’s top 3' },
      { id: 'cherries', text: 'Cherries to the fridge' },
      { id: 'phone', text: 'Phone to the desk' },
      { id: 'skincare', text: 'Skincare' },
      { id: 'bonus', text: 'Bonus stretch', tag: 'optional' }
    ]
  };

  var KEY = 'sofi-routine-v1';
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  var state = { day: today(), done: {} };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.day === state.day && saved.done) state = saved;
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var CHECK = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function render() {
    ['am', 'pm'].forEach(function (part) {
      var ul = document.getElementById('list-' + part);
      ul.innerHTML = '';
      ROUTINE[part].forEach(function (it) {
        var li = document.createElement('li');
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'item';
        b.id = 'item-' + it.id;
        b.setAttribute('aria-pressed', state.done[it.id] ? 'true' : 'false');
        b.innerHTML = '<span class="box">' + CHECK + '</span><span class="label"></span>';
        var label = b.querySelector('.label');
        label.textContent = it.text;
        if (it.tag) {
          var t = document.createElement('span');
          t.className = 'tag';
          t.textContent = it.tag;
          label.appendChild(t);
        }
        b.addEventListener('click', function () {
          if (state.day !== today()) state = { day: today(), done: {} };
          state.done[it.id] = !state.done[it.id];
          save();
          render();
        });
        li.appendChild(b);
        ul.appendChild(li);
      });
      var required = ROUTINE[part].filter(function (i) { return i.tag !== 'optional'; });
      var n = required.filter(function (i) { return state.done[i.id]; }).length;
      document.getElementById('count-' + part).textContent = n + ' of ' + required.length;
    });
    var all = ROUTINE.am.concat(ROUTINE.pm).filter(function (i) { return i.tag !== 'optional'; });
    var allDone = all.every(function (i) { return state.done[i.id]; });
    var status = document.getElementById('status');
    if (allDone) { status.className = 'done-msg'; status.textContent = 'All done today. Sleep well ✨'; }
    else { status.className = ''; status.textContent = 'Ticks clear by themselves each new day.'; }
  }

  document.getElementById('reset').addEventListener('click', function () {
    state = { day: today(), done: {} };
    save();
    render();
  });

  /* A home-screen app stays alive in the background for days, so re-check the date whenever it comes back. */
  function rollover() {
    if (state.day !== today()) { state = { day: today(), done: {} }; save(); render(); }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) rollover(); });
  window.addEventListener('pageshow', rollover);
  window.addEventListener('focus', rollover);
  setInterval(rollover, 60000);

  render();

  /* Offline support */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>

</body>
</html>
